[versions]
netty = "4.2.18.Final"
hikaricp = "7.1.0"
mariadb = "3.5.10"
slf4j = "2.0.19"
logback = "1.6.3"
jjwt = "0.13.0"
junit = "6.1.3"
assertj = "3.27.7"
testcontainers = "2.0.5"
errorprone = "2.50.0"
palantir-java-format = "2.98.0"

[libraries]
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler" }
netty-codec = { module = "io.netty:netty-codec" }
netty-transport = { module = "io.netty:netty-transport" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.2" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.1" }
