apply plugin: 'java'
sourceCompatibility = 1.8
targetCompatibility = 1.8

group 'org.starloco.locos'
// Version from the git branch or commit; "dev" when git is unavailable (e.g. Docker build).
def gitVersion = { String... args ->
    try {
        return ['git', *args].execute().getText().trim()
    } catch (IOException ignored) {
        return ''
    }
}
version gitVersion('rev-parse', '--abbrev-ref', 'HEAD') ?: 'dev'
if (version == 'HEAD') {
    version gitVersion('rev-parse', '--short', 'HEAD') ?: 'dev'
}

// Make sure we compile in UTF-8 mode
compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java {
            srcDirs 'src'
        }
    }
    test {
        java {
            srcDirs 'test'
        }
    }
}

// Runtime libraries are vendored in libs/; Maven Central is only used for test dependencies.
repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
}

test {
    testLogging {
        events 'passed', 'failed'
        exceptionFormat 'full'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "login.jar"

    manifest {
        attributes(
            'Main-Class': 'org.starloco.locos.kernel.Main'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
